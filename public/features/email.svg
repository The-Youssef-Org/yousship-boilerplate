<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8fafc" rx="16"/>

  <!-- email card -->
  <rect x="40" y="24" width="320" height="252" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- header bar -->
  <rect x="40" y="24" width="320" height="52" rx="14" fill="#1d4ed8"/>
  <rect x="40" y="52" width="320" height="24" fill="#1d4ed8"/>
  <text x="200" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="white">Welcome to BoilrBase 👋</text>

  <!-- from / to -->
  <text x="60" y="96" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">From: hello@boilrbase.com</text>
  <text x="60" y="112" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">To: you@startup.com</text>

  <!-- divider -->
  <line x1="60" y1="124" x2="340" y2="124" stroke="#e2e8f0" stroke-width="1"/>

  <!-- heading -->
  <text x="60" y="146" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e293b">You're in. Here's what's next.</text>

  <!-- placeholder lines -->
  <rect x="60" y="158" width="190" height="8" rx="4" fill="#f1f5f9"/>
  <rect x="60" y="173" width="230" height="8" rx="4" fill="#f1f5f9"/>
  <rect x="60" y="188" width="160" height="8" rx="4" fill="#f1f5f9"/>

  <!-- CTA -->
  <rect x="60" y="210" width="280" height="38" rx="9" fill="#1d4ed8"/>
  <text x="200" y="234" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="white">Get started →</text>

  <!-- footer -->
  <text x="200" y="262" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Sent via Resend · Unsubscribe</text>
</svg>
