<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8fafc" rx="16"/>

  <!-- credit card -->
  <rect x="60" y="28" width="280" height="162" rx="18" fill="#1d4ed8"/>
  <!-- shine overlay -->
  <ellipse cx="310" cy="56" rx="90" ry="70" fill="white" opacity="0.07"/>
  <!-- contactless circles -->
  <circle cx="308" cy="60" r="22" fill="none" stroke="white" stroke-width="1.2" opacity="0.4"/>
  <circle cx="308" cy="60" r="14" fill="none" stroke="white" stroke-width="1.2" opacity="0.4"/>
  <circle cx="308" cy="60" r="6" fill="none" stroke="white" stroke-width="1.2" opacity="0.5"/>
  <!-- chip -->
  <rect x="82" y="68" width="34" height="26" rx="5" fill="#93c5fd" opacity="0.75"/>
  <line x1="82" y1="81" x2="116" y2="81" stroke="#ede9fe" stroke-width="1" opacity="0.5"/>
  <line x1="99" y1="68" x2="99" y2="94" stroke="#ede9fe" stroke-width="1" opacity="0.5"/>
  <!-- card number -->
  <text x="82" y="130" font-family="monospace,system-ui" font-size="13" letter-spacing="2" fill="white" opacity="0.9">•••• •••• •••• 4242</text>
  <!-- labels row -->
  <text x="82" y="158" font-family="system-ui,sans-serif" font-size="10" fill="white" opacity="0.65">Card holder</text>
  <text x="280" y="158" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="white" opacity="0.65">Expires</text>
  <text x="82" y="174" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="white">Alex Martin</text>
  <text x="280" y="174" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="white">09/27</text>

  <!-- amount panel -->
  <rect x="60" y="204" width="280" height="70" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="228" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">Total due today</text>
  <text x="80" y="254" font-family="system-ui,sans-serif" font-size="24" font-weight="800" fill="#1e293b">$49.00</text>
  <!-- secured badge -->
  <rect x="268" y="236" width="58" height="22" rx="11" fill="#d1fae5"/>
  <text x="297" y="251" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#059669">✓ Secured</text>
</svg>
