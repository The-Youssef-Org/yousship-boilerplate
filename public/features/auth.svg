<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700&amp;display=swap');
    </style>
  </defs>
  <!-- page background (base-200) -->
  <rect width="480" height="360" fill="#191e24"/>

  <!-- auth dialog card with visible rounded border -->
  <rect x="40" y="16" width="400" height="328" rx="24" fill="#1d232a" stroke="#0d1117" stroke-width="0.75"/>

  <!-- "Welcome" heading -->
  <text x="240" y="72" text-anchor="middle" font-family="'Nunito Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#e6e8eb">Welcome</text>
  <!-- subtitle -->
  <text x="240" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">Sign in with Google or a magic link.</text>

  <!-- Google button (dark border, same fill as card) -->
  <rect x="68" y="108" width="344" height="44" rx="10" fill="#1d232a" stroke="#1e2833" stroke-width="1.5"/>
  <!-- Google G icon (48×48 → ~22 px) -->
  <g transform="translate(136, 119) scale(0.458)">
    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
    <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.3 35.6 26.8 36 24 36c-5.3 0-9.7-3.1-11.3-7.7l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.6l6.2 5.2C40.9 36.6 44 31 44 24c0-1.2-.1-2.4-.4-3.5z"/>
  </g>
  <text x="174" y="135" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#a6adbb">Continue with Google</text>

  <!-- OR divider (very dark lines) -->
  <line x1="68" y1="174" x2="220" y2="174" stroke="#1e2833" stroke-width="1"/>
  <text x="240" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" letter-spacing="1" fill="#3d4a5a">OR</text>
  <line x1="260" y1="174" x2="412" y2="174" stroke="#1e2833" stroke-width="1"/>

  <!-- Email address label -->
  <text x="68" y="200" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#8d95a0">Email address</text>

  <!-- Email input (same bg as card, dark border) -->
  <rect x="68" y="208" width="344" height="42" rx="10" fill="#1d232a" stroke="#1e2833" stroke-width="1.5"/>
  <text x="84" y="233" font-family="system-ui,sans-serif" font-size="11" fill="#3d4a5a">you@example.com</text>

  <!-- Send magic link button -->
  <rect x="68" y="264" width="344" height="44" rx="12" fill="#2563eb"/>
  <text x="240" y="291" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="white">Send magic link</text>
</svg>