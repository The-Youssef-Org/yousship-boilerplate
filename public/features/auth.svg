<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8fafc" rx="16"/>

  <!-- card -->
  <rect x="60" y="26" width="280" height="248" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- lock icon circle -->
  <circle cx="200" cy="76" r="26" fill="#ede9fe"/>
  <!-- lock body -->
  <rect x="188" y="74" width="24" height="18" rx="4" fill="#1d4ed8"/>
  <!-- lock shackle -->
  <path d="M192 74v-7a8 8 0 0 1 16 0v7" stroke="#1d4ed8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- keyhole -->
  <circle cx="200" cy="81" r="2.5" fill="white"/>
  <rect x="198.5" y="82" width="3" height="5" rx="1.5" fill="white"/>

  <!-- title -->
  <text x="200" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1e293b">Sign in to your account</text>

  <!-- email input -->
  <rect x="80" y="136" width="240" height="36" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="96" y="159" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">you@startup.com</text>

  <!-- magic link button -->
  <rect x="80" y="182" width="240" height="36" rx="9" fill="#1d4ed8"/>
  <text x="200" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="white">Send magic link</text>

  <!-- divider -->
  <line x1="80" y1="234" x2="178" y2="234" stroke="#e2e8f0" stroke-width="1"/>
  <text x="200" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">or</text>
  <line x1="222" y1="234" x2="320" y2="234" stroke="#e2e8f0" stroke-width="1"/>

  <!-- google button -->
  <rect x="80" y="246" width="240" height="22" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="200" y="261" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#374151">Continue with Google</text>
</svg>
