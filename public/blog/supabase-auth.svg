<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052E2B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B3A36"/>
      <stop offset="100%" stop-color="#0E2233"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="96" y="122" fill="#ECFDF5" font-family="Inter, ui-sans-serif, system-ui" font-size="34" font-weight="800">Supabase Auth, At a Glance</text>
  <text x="96" y="158" fill="#A7F3D0" font-family="Inter, ui-sans-serif, system-ui" font-size="18">From sign-in methods to sessions and protected routes</text>

  <rect x="96" y="214" width="308" height="344" rx="22" fill="url(#panel)" stroke="#1F4A46"/>
  <text x="128" y="260" fill="#F0FDF4" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="700">Auth methods</text>
  <rect x="128" y="286" width="244" height="58" rx="14" fill="#0F2F2C" stroke="#225A55"/>
  <text x="158" y="322" fill="#E5E7EB" font-family="Inter, ui-sans-serif, system-ui" font-size="18">Magic link</text>
  <rect x="128" y="360" width="244" height="58" rx="14" fill="#0F2F2C" stroke="#225A55"/>
  <text x="158" y="396" fill="#E5E7EB" font-family="Inter, ui-sans-serif, system-ui" font-size="18">OAuth providers</text>
  <rect x="128" y="434" width="244" height="58" rx="14" fill="#0F2F2C" stroke="#225A55"/>
  <text x="158" y="470" fill="#E5E7EB" font-family="Inter, ui-sans-serif, system-ui" font-size="18">Email + password</text>
  <text x="128" y="528" fill="#86EFAC" font-family="Inter, ui-sans-serif, system-ui" font-size="16">One backend, multiple sign-in paths</text>

  <rect x="446" y="214" width="286" height="344" rx="22" fill="#111827" stroke="#334155"/>
  <text x="478" y="260" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="700">Session layer</text>
  <rect x="478" y="292" width="222" height="72" rx="16" fill="#0F172A" stroke="#334155"/>
  <text x="510" y="336" fill="#93C5FD" font-family="Inter, ui-sans-serif, system-ui" font-size="18">Browser client</text>
  <path d="M589 364V406" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>
  <rect x="478" y="422" width="222" height="72" rx="16" fill="#0F172A" stroke="#334155"/>
  <text x="511" y="466" fill="#A7F3D0" font-family="Inter, ui-sans-serif, system-ui" font-size="18">Cookie session</text>
  <text x="478" y="520" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui" font-size="15">
    <tspan x="478" dy="0">Refreshed server-side for</tspan>
    <tspan x="478" dy="20">protected pages</tspan>
  </text>

  <rect x="774" y="214" width="330" height="344" rx="22" fill="#0F172A" stroke="#334155"/>
  <text x="806" y="260" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="700">Protected route</text>
  <rect x="806" y="288" width="266" height="170" rx="18" fill="#111827" stroke="#374151"/>
  <text x="832" y="326" fill="#A7F3D0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">const session =</text>
  <text x="832" y="350" fill="#A7F3D0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">await auth()</text>
  <text x="832" y="380" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">if (!session)</text>
  <text x="832" y="404" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">redirect("/signin")</text>
  <text x="832" y="434" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">return &lt;Dashboard /&gt;</text>
  <rect x="806" y="484" width="164" height="42" rx="21" fill="#10B981"/>
  <text x="888" y="511" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="700" text-anchor="middle">Access granted</text>
</svg>
